<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
  <title id="t">Bonjour, je suis NjGuitlab</title>
  <desc id="d">Développeur logiciel | Backend | API REST | QA &amp; Automatisation. Fenêtre de code décorative inspirée de VS Code.</desc>
  <defs>
    <radialGradient id="glowBlue" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2196F3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2196F3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.9" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#20D6C7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#20D6C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#20D6C7"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .code text { white-space: pre; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <!-- fond -->
  <rect width="1000" height="430" rx="14" fill="#0D1117"/>
  <rect width="1000" height="430" rx="14" fill="url(#glowBlue)"/>
  <rect width="1000" height="430" rx="14" fill="url(#glowTeal)"/>
  <rect x="0.5" y="0.5" width="999" height="429" rx="14" fill="none" stroke="#30363D"/>

  <!-- titre -->
  <text x="48" y="92" class="mono" font-size="34" font-weight="700" fill="#E6EDF3"><tspan fill="#20D6C7">&gt;</tspan> Bonjour, je suis <tspan fill="#2196F3">NjGuitlab</tspan><tspan class="cursor" fill="#20D6C7">_</tspan></text>
  <text x="50" y="132" class="sans" font-size="18" fill="#8B949E">Développeur logiciel  ·  Backend  ·  API REST  ·  QA &amp; Automatisation</text>
  <rect x="50" y="150" width="120" height="3" rx="1.5" fill="url(#line)"/>

  <!-- fenêtre VS Code -->
  <g transform="translate(48,178)">
    <rect width="904" height="224" rx="10" fill="#161B22" stroke="#30363D"/>
    <path d="M0 10 a10 10 0 0 1 10 -10 h884 a10 10 0 0 1 10 10 v24 h-904 z" fill="#0D1117"/>
    <line x1="0" y1="34" x2="904" y2="34" stroke="#30363D"/>
    <circle cx="20" cy="17" r="6" fill="#FF5F56"/>
    <circle cx="40" cy="17" r="6" fill="#FFBD2E"/>
    <circle cx="60" cy="17" r="6" fill="#27C93F"/>
    <!-- onglet -->
    <rect x="86" y="6" width="170" height="28" rx="4" fill="#161B22" stroke="#30363D"/>
    <rect x="86" y="32" width="170" height="3" fill="#161B22"/>
    <rect x="86" y="6" width="170" height="2" rx="1" fill="#2196F3"/>
    <text x="102" y="25" class="mono" font-size="13" fill="#2196F3">TS</text>
    <text x="126" y="25" class="mono" font-size="13" fill="#E6EDF3">profil.config.ts</text>

    <g class="mono code" font-size="15" xml:space="preserve">
      <!-- numéros de ligne -->
      <g fill="#484F58" text-anchor="end">
        <text x="34" y="64">1</text><text x="34" y="86">2</text><text x="34" y="108">3</text>
        <text x="34" y="130">4</text><text x="34" y="152">5</text><text x="34" y="174">6</text>
        <text x="34" y="196">7</text><text x="34" y="218">8</text>
      </g>
      <text xml:space="preserve" x="52" y="64"><tspan fill="#C678DD">export const</tspan><tspan fill="#E6EDF3"> developpeur = {</tspan></text>
      <text xml:space="preserve" x="52" y="86"><tspan fill="#E6EDF3">  role: </tspan><tspan fill="#20D6C7">"Développeur logiciel · Backend · QA"</tspan><tspan fill="#E6EDF3">,</tspan></text>
      <text xml:space="preserve" x="52" y="108"><tspan fill="#E6EDF3">  langages: [</tspan><tspan fill="#20D6C7">"Java"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"TypeScript"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"JavaScript"</tspan><tspan fill="#E6EDF3">],</tspan></text>
      <text xml:space="preserve" x="52" y="130"><tspan fill="#E6EDF3">  backend: [</tspan><tspan fill="#20D6C7">"Node.js"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"Express"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"Prisma"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"PostgreSQL"</tspan><tspan fill="#E6EDF3">],</tspan></text>
      <text xml:space="preserve" x="52" y="152"><tspan fill="#E6EDF3">  qualite: [</tspan><tspan fill="#20D6C7">"JUnit"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"Selenium"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"Cucumber"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"Playwright"</tspan><tspan fill="#E6EDF3">],</tspan></text>
      <text xml:space="preserve" x="52" y="174"><tspan fill="#E6EDF3">  equipe: [</tspan><tspan fill="#20D6C7">"Git"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"Pull Requests"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#20D6C7">"Scrum"</tspan><tspan fill="#E6EDF3">],</tspan></text>
      <text xml:space="preserve" x="52" y="196"><tspan fill="#E6EDF3">  recherche: </tspan><tspan fill="#2196F3">{</tspan><tspan fill="#E6EDF3"> type: </tspan><tspan fill="#20D6C7">"Stage"</tspan><tspan fill="#E6EDF3">, ville: </tspan><tspan fill="#20D6C7">"Montréal"</tspan><tspan fill="#E6EDF3">, debut: </tspan><tspan fill="#20D6C7">"2027-01"</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#2196F3">}</tspan><tspan fill="#E6EDF3">,</tspan></text>
      <text xml:space="preserve" x="52" y="218"><tspan fill="#E6EDF3">};</tspan><tspan class="cursor" fill="#20D6C7">▍</tspan></text>
    </g>
  </g>
</svg>
